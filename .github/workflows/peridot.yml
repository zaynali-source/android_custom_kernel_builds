name: Build Khargosh Kernel (Peridot Android 16)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional kernel source ref (defaults to sixteen)
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
      - name: Checkout Android 16 kernel source
        uses: actions/checkout@v4
        with:
          repository: sm8635-dev/kernel_xiaomi_sm8635
          ref: ${{ inputs.ref || 'sixteen' }}
          path: source
      - name: Checkout Android 16 device trees
        uses: actions/checkout@v4
        with:
          repository: sm8635-dev/kernel_xiaomi_sm8635-devicetrees
          ref: sixteen
          path: source/sm8635-devicetrees
      - name: Apply requested DPC recalibration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/sm8635-devicetrees/qcom/cliffs.dtsi")
          s = p.read_text()
          expected = {"dynamic-power-coefficient = <100>;": 3, "dynamic-power-coefficient = <287>;": 4, "dynamic-power-coefficient = <664>;": 1}
          for line, count in expected.items():
              actual = s.count(line)
              if actual != count:
                  raise SystemExit(f"Expected {count} occurrences of {line!r}, found {actual}; aborting safely")
          s = s.replace("dynamic-power-coefficient = <100>;", "dynamic-power-coefficient = <123>;")
          s = s.replace("dynamic-power-coefficient = <287>;", "dynamic-power-coefficient = <261>;")
          s = s.replace("dynamic-power-coefficient = <664>;", "dynamic-power-coefficient = <624>;")
          p.write_text(s)
          PY
          git -C source/sm8635-devicetrees diff --check
          git -C source/sm8635-devicetrees diff -- qcom/cliffs.dtsi
      - name: Build kernel in existing Peridot container
        uses: ./builder/actions/peridot
      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: khargosh-peridot-android16
          path: builder/actions/peridot/AnyKernel3/*
          if-no-files-found: error
